<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Revenue</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .plot-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="plot-container">
        <div id="delta-revenue-plot" style="height: 100%; width: 100%;"></div>
    </div>
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <script>
        const data = [{
            type: 'bar',
            x: ['Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec', 'Jan', 'Feb', 'Mar', 'Apr', 'May'],
            y: [100, 120, 150, 180, 200, 220, 250, 280, 300, 320, 350, 380],
            marker: {
                color: [100, 120, 150, 180, 200, 220, 250, 280, 300, 320, 350, 380],
                colorscale: [[0, 'red'], [1, 'green']]
            },
            hovertemplate: 'Month=%{x}<br>Delta=%{marker.color}<extra></extra>'
        }];

        const layout = {
            title: 'Month-to-Month Δ Revenue',
            xaxis: { title: 'Month' },
            yaxis: { title: 'Delta' },
            coloraxis: { colorbar: { title: 'Delta' } },
            barmode: 'relative'
        };

        const config = { responsive: true };

        Plotly.newPlot('delta-revenue-plot', data, layout, config);
    </script>
</body>
</html>
